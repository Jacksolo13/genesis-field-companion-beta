t:contain;object-position:left;display:block;margin:6px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls label{display:block;font-size:13px;color:var(--muted)}.controls input,.controls select{width:100%}.full{grid-column:1/-1}label{display:block}input[type=checkbox]{width:20px;min-height:20px;vertical-align:middle;accent-color:#d9bb76}input[type=number]{width:76px}input[type=search],textarea,select{width:100%}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.metric{border:1px solid var(--line);border-radius:8px;text-align:center;padding:9px 2px;background:#0c1622}.metric b{display:block;font-size:22px;color:var(--accent)}.metric small{font-size:11px}.warn{color:#ffce93}.good{color:#b8e4c4}.skillrow{border-top:1px solid var(--line);padding:12px 0}.rankline{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:12px;color:#c9d8e5;letter-spacing:.3px}.rankline input{width:68px}.rankline strong{font-size:15px}.entry{margin:7px 0;padding:8px 0;border-top:1px solid var(--line)}.entry:first-child{border:0}p{margin:5px 0 12px}a{color:#91d8f0}ol{padding-left:22px}li{margin:6px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.sectionlabel{font-size:12px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}textarea{min-height:100px;resize:vertical}.notice{font-size:13px;border-left:3px solid #c8a366;padding-left:10px;color:#d9d4c4}

let state={p:'Imperial Agent',level:50,extra:0,force:false,training:false,advanced:false,overrides:{},journal:[]};let storage=true;try{let x=localStorage.getItem(STORAGE_KEY);if(!x){for(const key of LEGACY_STORAGE_KEYS){x=localStorage.getItem(key);if(x)break}}if(x){Object.assign(state,JSON.parse(x));localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}}catch{storage=false}function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch{storage=false}}
function tone(n){return colors[D.profiles.findIndex(p=>p.name===n)]||'#d9bb76'}function profile(n){return D.profiles.find(p=>p.name===n)||D.profiles[0]}function field(n,v){return v?`<div class="entry"><h3>${E(n)}</h3><p>${E(v)}</p></div>`:''}function fold(n,html,open=false){return `<details ${open?'open':''}><summary>${E(n)}</summary>${html}</details>`}function show(t){tab=t;chosen=null;render();window.scrollTo(0,0)}function render(){ $('nav').innerHTML=names.map((n,i)=>`<button class="${i===tab?'active':''}" onclick="show(${i})">${E(n)}</button>`).join('');[professions,planner,skills,powers,journal,sources][tab]()}
function professions(){if(!chosen){app.innerHTML=`<div class="eyebrow">16 career dossiers</div><h2>Choose your path</h2><p class="muted">Tap a portrait for its build, progression and roleplay guide.</p><div class="grid">${D.profiles.map((p,i)=>`<button class="tile" style="--tone:${colors[i]}" onclick="openProf(${i})"><img src="${p.image}" alt=""><div><strong>${E(p.name)}</strong><small>${E(p.primary)}</small></div></button>`).join('')}</div>`;return}const p=profile(chosen);app.innerHTML=`<button onclick="chosen=null;professions()">← All professions</button><div class="panel hero" style="--tone:${tone(p.name)}"><img src="${p.image}" alt="${E(p.name)} portrait"><div><div class="eyebrow">Career dossier</div><h2>${E(p.name)}</h2><div class="glyph" aria-hidden="true">${E(p.name.toLowerCase())}</div><small>${E(p.orientation)} · ${E(p.primary)}</small></div></div><button onclick="useBuild()" style="width:100%;border-color:var(--accent);color:var(--accent)">Load into skill planner</button>${fold('Career dossier',p.career.map((v,i)=>field(['Starting profile','Faction & location','GAME • documented anchors','ROLEPLAY • career loop','ROLEPLAY • gear & endgame','Source IDs'][i],v)).join(''),true)}${fold('Full roleplay guide',p.role.map((v,i)=>field(['Identity','Mission interpretation','Faction approach','Personal code','Base, ship & journal','Progression arc'][i],v)).join(''),true)}${fold('Character build',p.profile.map(r=>field(...r)).join(''))}${fold('Level milestones',p.milestones.map(r=>`<div class="entry"><h3>Level ${r[0]} · ${E(r[4])}</h3><small>${r[2]} allocated / ${r[1]} earned · ${r[3]} reserve</small><p>${E(r[5])}</p></div>`).join(''))}${fold('Complete purchase order',`<ol>${p.plan.map(r=>`<li>Level ${r[1]} · ${E(r[0])} R${r[2]}</li>`).join('')}</ol>`)}<p class="notice">Provisional paths; rank challenges, exact tier gates and equipment availability require in-game validation. Roleplay concepts do not add game mechanics.</p>`}function openProf(i){chosen=D.profiles[i].name;professions();window.scrollTo(0,0)}function useBuild(){setProfession(chosen);show(1)}function setProfession(n){state.p=n;state.force=profile(n).orientation==='Force-sensitive';state.training=false;state.advanced=false;state.overrides={};persist()}
function calc(){let p=profile(state.p), rec={};for(const [skill,l,r] of p.plan)if(l<=state.level)rec[skill]=Math.max(rec[skill]||0,r);const vals=D.skills.map(s=>({s,r:state.overrides[s[2]]??rec[s[2]]??0,rec:rec[s[2]]||0}));let spent=vals.reduce((a,b)=>a+b.r,0),budget=state.level-1+state.extra, errors=[];for(const v of vals){let [tr,t,n,max]=v.s,r=v.r,low=vals.filter(z=>z.s[0]===tr&&z.s[1]<t).reduce((a,z)=>a+z.r,0);v.err=[];if(r>max||r<0||!Number.isInteger(r))v.err.push('Rank exceeds documented cap');if(r>0&&low<[0,4,8,12][t-1])v.err.push('Assumed tier gate not met');if(r>0&&(['Dodge','Double Jump','Mind Trick','Control Mind'].includes(n)||n==='Lightsaber Deflection'&&r>=2)&&!state.force)v.err.push('Requires Force Sensitivity');if(n==='Lightsaber Deflection'&&r>=3&&!state.training)v.err.push('Lightsaber Training required');if(n==='Lightsaber Deflection'&&r>=4&&!state.advanced)v.err.push('Advanced Training required');if(v.err.length)errors.push(n+': '+v.err.join('; '))}return {vals,spent,budget,errors}}
let planFilter='Selected';function planner(){const c=calc();app.innerHTML=`<h2>Character skill planner</h2><div class="panel controls"><label class="full">Profession<select onchange="setProfession(this.value);planner()">${D.profiles.map(p=>`<option ${p.name===state.p?'selected':''}>${E(p.name)}</option>`).join('')}</select></label><label>Target level<input type="number" min="1" max="100" value="${state.level}" onchange="setNumber('level',this.value,1,100)"></label><label>Extra points<input type="number" min="0" max="999" value="${state.extra}" onchange="setNumber('extra',this.value,0,999)"></label>${[['force','Force-sensitive'],['training','Lightsaber training'],['advanced','Advanced training']].map(([k,n])=>`<label class="full"><input type="checkbox" ${state[k]?'checked':''} onchange="state.${k}=this.checked;persist();planner()"> ${n}</label>`).join('')}</div><div class="metrics"><div class="metric"><b>${c.budget}</b><small>Budget</small></div><div class="metric"><b>${c.spent}</b><small>Allocated</small></div><div class="metric"><b>${c.budget-c.spent}</b><small>Remaining</small></div></div><div class="panel"><strong class="${c.errors.length||c.spent>c.budget?'warn':'good'}">${c.errors.length||c.spent>c.budget?'Review allocation':'Provisional checks passed'}</strong>${c.spent>c.budget?'<p class="warn">Over point budget.</p>':''}${c.errors.map(x=>`<div class="warn">${E(x)}</div>`).join('')}<p class="notice">Assumed tier gates: 0 / 4 / 8 / 12 lower-tier points. Earned points = level − 1. Rank challenges and stacking are not tested.</p></div><div class="row"><button onclick="planFilter='Selected';planner()" class="${planFilter==='Selected'?'active':''}">Selected skills</button><button onclick="planFilter='All';planner()" class="${planFilter==='All'?'active':''}">All 88 skills</button><button onclick="state.overrides={};persist();planner()">Reset ranks</button></div><div class="panel">${c.vals.filter(v=>planFilter==='All'||v.r||v.rec).map(v=>`<div class="skillrow"><div class="rankline"><div><strong>${E(v.s[2])}</strong><div class="tag">${E(v.s[0])} · T${v.s[1]} · suggested R${v.rec}</div></div><input aria-label="${E(v.s[2])} rank" type="number" min="0" max="${v.s[3]}" value="${v.r}" onchange="setRank(${D.skills.indexOf(v.s)},this.value)"></div><small>${E(v.r>0?v.s[3+v.r]:'Not selected')}</small>${v.err.map(x=>`<div class="warn">${E(x)}</div>`).join('')}</div>`).join('')||'No skills allocated.'}</div>`}function setNumber(k,v,min,max){state[k]=Math.min(max,Math.max(min,Math.floor(Number(v)||0)));persist();planner()}function setRank(i,v){let s=D.skills[i];state.overrides[s[2]]=Math.max(0,Math.min(s[3],Math.floor(Number(v)||0)));persist();planner()}
function skills(){app.innerHTML=`<h2>Skill archive</h2><input type="search" placeholder="Search all 88 skills" value="${E(query)}" oninput="query=this.value;skillResults()"><select style="margin-top:8px" onchange="tree=this.value;skillResults()">${['All','Physical','Social','Combat','Science','Tech'].map(t=>`<option ${tree===t?'selected':''}>${t}</option>`).join('')}</select><div id="skillResults"></div>`;skillResults()}function skillResults(){$('skillResults').innerHTML=D.skills.filter(s=>(tree==='All'||s[0]===tree)&&s.slice(0,10).join(' ').toLowerCase().includes(query.toLowerCase())).map(s=>fold(`${s[2]} · ${s[0]} T${s[1]}`,Array.from({length:s[3]},(_,i)=>field('Rank '+(i+1),s[4+i]||'Not documented')).join('')+field('Prerequisites',s[9])+field('Status',s[10])+field('Notes',s[11])+field('Source photo',s[12]))).join('')||'<p>No results.</p>'}
function powers(){app.innerHTML=`<h2>Force power archive</h2><p class="notice">Native, later-patch, optional-mod and unconfirmed powers are kept distinct. Costs apply only to the observed setup.</p><input type="search" placeholder="Search Force powers" value="${E(powerQuery)}" oninput="powerQuery=this.value;powerResults()"><div id="powerResults"></div>${fold('Force mechanics & training',D.mechanics.map(r=>field(r[0],r.slice(1).join(' • '))).join(''))}`;powerResults()}function powerResults(){$('powerResults').innerHTML=D.powers.filter(r=>r.join(' ').toLowerCase().includes(powerQuery.toLowerCase())).map(r=>fold(r[0],field('Implementation',r[1])+field('Observed rank (other setup)',r[2])+field('Observed cost / pool',r[3]!=null?`${r[3]} / ${r[4]} Power`:null)+field('Base effect (reported)',r[5])+field('Replaces (reported)',r[6])+field('Jedi Mojo effect (reported)',r[7])+field('Lore theme',r[8])+field('Evidence',r[9])+field('Source',r[10]))).join('')||'<p>No results.</p>'}
function journal(){app.innerHTML=`<h2>Campaign journal</h2><p class="muted">Record actual gameplay and fictional consequences separately. ${storage?'Entries are saved in this browser if local storage is supported.':'Browser storage is unavailable; export before closing.'}</p><div class="panel"><label>Profession<select id="jp">${D.profiles.map(p=>`<option ${p.name===state.p?'selected':''}>${E(p.name)}</option>`).join('')}</select></label><label>Mission / contact<input id="jt" style="width:100%" placeholder="Assignment or target"></label><label>Actual game outcome<textarea id="ja"></textarea></label><label>Roleplay consequence / next lead<textarea id="jr"></textarea></label><button onclick="saveEntry()" style="width:100%;color:var(--accent)">Record mission</button></div><div class="row"><button onclick="backup()">Export backup</button><button onclick="$('restore').click()">Import backup</button></div><input id="restore" class="hidden" type="file" accept="application/json,.json" onchange="restoreBackup(this)">${state.journal.slice().reverse().map((j,i)=>`<div class="panel"><small>${E(j.date)} · ${E(j.p)}</small><h3>${E(j.title)}</h3>${field('Actual outcome',j.actual)}${field('Roleplay',j.rp)}<button onclick="removeEntry(${state.journal.length-1-i})">Delete entry</button></div>`).join('')||'<p class="muted">No recorded missions yet.</p>'}`}
function saveEntry(){if(!$('jt').value.trim()){$('jt').focus();return}state.journal.push({date:new Date().toLocaleDateString('en-GB'),p:$('jp').value,title:$('jt').value,actual:$('ja').value,rp:$('jr').value});persist();journal()}function removeEntry(i){if(confirm('Delete this journal entry?')){state.journal.splice(i,1);persist();journal()}}function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='Genesis-character-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restoreBackup(i){try{let x=JSON.parse(await i.files[0].text());if(!Array.isArray(x.journal)||!D.profiles.some(p=>p.name===x.p)||!x.overrides||!Number.isInteger(x.level)||x.level<1||x.level>100||!Number.isInteger(x.extra)||x.extra<0)throw 0;for(let [k,v] of Object.entries(x.overrides)){let s=D.skills.find(s=>s[2]===k);if(!s||!Number.isInteger(v)||v<0||v>s[3])throw 0}if(confirm('Replace current planner and journal with this backup?')){state=x;persist();journal()}}catch{alert('Invalid backup file.')}}
function sources(){app.innerHTML=`<h2>Evidence archive</h2><p class="notice">Transcribed from the v0.8 workbook. Screenshot baseline 8.8; research through 8.8.4.1. This mobile edition does not independently reverify the source claims.</p>${fold('Outstanding verification',D.verification.map(r=>field(r[0],r.slice(1).join(' • '))).join(''),true)}${D.sources.map(r=>`<div class="panel"><h3>${E(r[0])} · ${E(r[1])}</h3><p>${E(r[2])}</p><a href="${E(r[3])}" target="_blank" rel="noopener">Open source</a></div>`).join('')}`}
let installPrompt=null;const installButton=$('installButton'),offlineBadge=$('offlineBadge'),splash=$('splash');
function updateConnection(){offlineBadge.classList.toggle('hidden',navigator.onLine)}
window.addEventListener('online',updateConnection);window.addEventListener('offline',updateConnection);updateConnection();
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;if(!window.matchMedia('(display-mode: standalone)').matches)installButton.classList.remove('hidden')});
installButton.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.classList.add('hidden')});
window.addEventListener('appinstalled',()=>{installPrompt=null;installButton.classList.add('hidden')});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
render();requestAnimationFrame(()=>setTimeout(()=>{splash.classList.add('hide');setTimeout(()=>splash.remove(),350)},180));
</script></body></html>
